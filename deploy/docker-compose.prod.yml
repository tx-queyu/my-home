# 生产部署用 compose：postgres + backend 一体
# 数据卷映射到宿主机 /opt/myhome/data/pg 持久化
# backend 通过 .env 注入 MYHOME_* 配置
#
# 启动：cd deploy && docker compose -f docker-compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: myhome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myhome}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myhome_prod_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-myhome}
    volumes:
      - /opt/myhome/data/pg:/var/lib/postgresql/data
    # 不映射端口到宿主机：只能被同 compose 网络内的 backend 访问（最安全）
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myhome} -d ${POSTGRES_DB:-myhome}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../services/backend
      dockerfile: Dockerfile
    container_name: myhome-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MYHOME_APP_NAME: ${MYHOME_APP_NAME:-MyHome-Backend}
      MYHOME_ENVIRONMENT: ${MYHOME_ENVIRONMENT:-prod}
      MYHOME_DEBUG: ${MYHOME_DEBUG:-false}
      MYHOME_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-myhome}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-myhome}
      MYHOME_CORS_ORIGINS: ${MYHOME_CORS_ORIGINS:-*}
      MYHOME_JWT_SECRET: ${MYHOME_JWT_SECRET:?MYHOME_JWT_SECRET 必须设置}
      MYHOME_JWT_ALGORITHM: ${MYHOME_JWT_ALGORITHM:-HS256}
      MYHOME_ACCESS_TOKEN_EXPIRE_MINUTES: ${MYHOME_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      MYHOME_REFRESH_TOKEN_EXPIRE_DAYS: ${MYHOME_REFRESH_TOKEN_EXPIRE_DAYS:-90}
      MYHOME_POOL_SIZE: ${MYHOME_POOL_SIZE:-5}
      MYHOME_REGISTRATION_ENABLED: ${MYHOME_REGISTRATION_ENABLED:-false}
      MYHOME_CRYPTO_KEY: ${MYHOME_CRYPTO_KEY:?MYHOME_CRYPTO_KEY 必须设置}
      MYHOME_VERIFICATION_CODE_TTL_MINUTES: ${MYHOME_VERIFICATION_CODE_TTL_MINUTES:-10}
      MYHOME_VERIFICATION_CODE_MAX_ATTEMPTS: ${MYHOME_VERIFICATION_CODE_MAX_ATTEMPTS:-5}
      MYHOME_VERIFY_TOKEN_TTL_MINUTES: ${MYHOME_VERIFY_TOKEN_TTL_MINUTES:-10}
      MYHOME_VERIFICATION_DAILY_TARGET_LIMIT: ${MYHOME_VERIFICATION_DAILY_TARGET_LIMIT:-10}
      MYHOME_VERIFICATION_HOURLY_IP_LIMIT: ${MYHOME_VERIFICATION_HOURLY_IP_LIMIT:-20}
      # 讯飞语音评测（ISE）—— 朗读单词评分；未配置时 /assess 返回 enabled=false 前端降级
      MYHOME_IFLYTEK_APP_ID: ${MYHOME_IFLYTEK_APP_ID:-}
      MYHOME_IFLYTEK_API_KEY: ${MYHOME_IFLYTEK_API_KEY:-}
      MYHOME_IFLYTEK_API_SECRET: ${MYHOME_IFLYTEK_API_SECRET:-}
      MYHOME_READING_PASS_SCORE: ${MYHOME_READING_PASS_SCORE:-60}
    ports:
      - "8000:8000"
    # 健康检查：startup 后约 2-3s 内 OK
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  landing:
    build:
      context: ../apps/landing
      dockerfile: Dockerfile
    container_name: myhome-landing
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
