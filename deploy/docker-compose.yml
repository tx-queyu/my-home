services:
  postgres:
    image: postgres:16-alpine
    container_name: myhome-postgres
    environment:
      POSTGRES_USER: myhome
      POSTGRES_PASSWORD: myhome_dev
      POSTGRES_DB: myhome
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myhome -d myhome"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
