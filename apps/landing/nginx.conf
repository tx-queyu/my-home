# MyHome landing — 纯静态文件服务 + backend API 反代
server {
    listen 80;
    server_name _;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # VitePress 带哈希文件名的静态资源：1 年不可变缓存
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }

    # APK 文件：正确 MIME + 强制下载
    location ~* \.apk$ {
        root /usr/share/nginx/html;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment";
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # HTML 入口：永远不缓存，确保发版后用户立刻拿到新 index.html
    location = /index.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback：根路径访问返回 index.html
    # $uri.html：VitePress cleanUrls=true 生成 .html 文件但 URL 无后缀（/download → download.html）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ── 反代到 backend（docker compose 内部 DNS：backend:8000）──
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # FastAPI Swagger UI 入口
    location /docs {
        proxy_pass http://backend:8000/docs;
    }
    # Swagger UI 内部 fetch 的 schema 路径
    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }
    # 健康检查
    location /health {
        proxy_pass http://backend:8000/health;
    }
    # 业务 API
    location /api/ {
        proxy_pass http://backend:8000/api/;
        client_max_body_size 10m;
    }
}
