[project]
name = "myhome-backend"
version = "0.1.0"
description = "Family-use home + education backend (FastAPI monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.0.0",
    "asyncpg==0.30.0",
    "python-jose==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt<4.1.0",
    "pydantic==2.10.4",
    "pydantic[email]==2.10.4",
    "pydantic-settings==2.7.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 110
target-version = "py311"
